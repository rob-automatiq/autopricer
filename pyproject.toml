[project]
name = "autopricer"
version = "0.2.0"
description = "Ticket pricing for Minnesota Timberwolves 2026-27 home games at Target Center"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.53,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "httpx>=0.28", "playwright>=1.56"]

[project.scripts]
autopricer = "autopricer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["autopricer"]

[tool.setuptools.package-data]
autopricer = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
