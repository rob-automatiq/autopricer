services:
  autopricer:
    build:
      context: .
      args:
        BUILD: ${AUTOPRICER_BUILD:-dev}
    image: autopricer:latest
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      # The container is already isolated by its network namespace, and the
      # published port above is bound to loopback, so it listens on all
      # interfaces *inside* the namespace only.
      AUTOPRICER_HOST: 0.0.0.0
      AUTOPRICER_PORT: "8765"
      AUTOPRICER_LOG_LEVEL: info
      # Set this to enable POST /api/reload:
      #   AUTOPRICER_RELOAD_TOKEN=$(openssl rand -hex 16) docker compose up -d
      AUTOPRICER_RELOAD_TOKEN: ${AUTOPRICER_RELOAD_TOKEN:-}
    volumes:
      # Re-extract the snapshot on the host, then POST /api/reload -- no
      # rebuild, no restart. Read-only: the app never writes it.
      - ./data/raw:/app/data/raw:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
